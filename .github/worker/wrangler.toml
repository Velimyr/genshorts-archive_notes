name = "genshorts-telegram"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
GITHUB_REPO = "Velimyr/genshorts-archive_notes"

[[kv_namespaces]]
binding = "QUEUE"
id = "d7ef9128f7f14db983b309aeb44f0a44"

# Кожні 5 хвилин: запуски диспетчера в момент, який він попросив (/due), запобіжні двічі на добу
# і пропущені натискання. Сам воркер Actions не витрачає.
[triggers]
crons = ["*/5 * * * *"]
