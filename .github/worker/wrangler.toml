name = "genshorts-telegram"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
GITHUB_REPO = "Velimyr/genshorts-archive_notes"

[[kv_namespaces]]
binding = "QUEUE"
id = "d7ef9128f7f14db983b309aeb44f0a44"

# Кожні 5 хвилин: щогодинний запуск диспетчера і точні запуски на заплановані публікації.
[triggers]
crons = ["*/5 * * * *"]
