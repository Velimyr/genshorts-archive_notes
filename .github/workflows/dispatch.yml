name: telegram-dispatch

# Запускається вебхуком Cloudflare Worker (.github/worker) після натискання в Telegram
# (якщо попередній запуск ще не чекає натискань), у момент, який диспетчер сам попросив
# через /due (публікація, нагадування, аналітика, ранкові питання), двічі на добу як
# запобіжник, після змін у data/ і вручну.
on:
  push:
    branches: [main]
    paths: ["data/**"]
  workflow_dispatch:
    inputs:
      update:
        description: "Оновлення Telegram (JSON) від воркера"
        required: false
        default: ""

concurrency:
  group: telegram-dispatch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Від цього моменту диспетчер рахує вже оплачену хвилину, до кінця якої чекає натискань.
      - name: Mark job start
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      # Саме гілка main, а не коміт на момент натискання: запуски стоять у черзі,
      # і кожен має починати з результату попереднього.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Exchange with Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ROUTINE_IDEAS_URL: ${{ secrets.ROUTINE_IDEAS_URL }}
          ROUTINE_IDEAS_TOKEN: ${{ secrets.ROUTINE_IDEAS_TOKEN }}
          ROUTINE_TEXTS_URL: ${{ secrets.ROUTINE_TEXTS_URL }}
          ROUTINE_TEXTS_TOKEN: ${{ secrets.ROUTINE_TEXTS_TOKEN }}
          ROUTINE_ANALYTICS_URL: ${{ secrets.ROUTINE_ANALYTICS_URL }}
          ROUTINE_ANALYTICS_TOKEN: ${{ secrets.ROUTINE_ANALYTICS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN_UPDATED: ${{ vars.THREADS_TOKEN_UPDATED }}
          QUEUE_URL: ${{ vars.QUEUE_URL }}
          QUEUE_SECRET: ${{ secrets.QUEUE_SECRET }}
          TG_CHANNEL_ID: ${{ vars.TG_CHANNEL_ID }}
          TG_MAIN_CHANNEL_ID: ${{ vars.TG_MAIN_CHANNEL_ID }}
          TG_POSTER_TOKEN: ${{ secrets.TG_POSTER_TOKEN }}
          EVENT_UPDATE: ${{ inputs.update }}
        run: python3 .github/bot/dispatch.py

      - name: Save state
        run: |
          git config user.name "genshorts-dispatch"
          git config user.email "genshorts-dispatch@users.noreply.github.com"
          git add data .github/bot/state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "dispatch: telegram exchange"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1

      - name: Start cloud routines
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ROUTINE_IDEAS_URL: ${{ secrets.ROUTINE_IDEAS_URL }}
          ROUTINE_IDEAS_TOKEN: ${{ secrets.ROUTINE_IDEAS_TOKEN }}
          ROUTINE_TEXTS_URL: ${{ secrets.ROUTINE_TEXTS_URL }}
          ROUTINE_TEXTS_TOKEN: ${{ secrets.ROUTINE_TEXTS_TOKEN }}
          ROUTINE_ANALYTICS_URL: ${{ secrets.ROUTINE_ANALYTICS_URL }}
          ROUTINE_ANALYTICS_TOKEN: ${{ secrets.ROUTINE_ANALYTICS_TOKEN }}
          QUEUE_URL: ${{ vars.QUEUE_URL }}
          QUEUE_SECRET: ${{ secrets.QUEUE_SECRET }}
        run: python3 .github/bot/dispatch.py --fire
